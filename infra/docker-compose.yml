services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_soc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_soc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    working_dir: /app
    env_file:
      - ../backend/.env.example
    command: >
      sh -c "python scripts/wait_for_services.py &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../backend:/app
      - ml_artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    working_dir: /app
    env_file:
      - ../backend/.env.example
    command: >
      sh -c "python scripts/wait_for_services.py &&
      python -m app.workers.investigation"
    volumes:
      - ../backend:/app
      - ml_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ml_artifacts:
